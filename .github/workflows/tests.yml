name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: meva
          POSTGRES_USER: meva
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U meva -d meva"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, exif, gd, intl, pcntl, pdo_pgsql, pgsql, zip
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      # The suite runs on in-memory SQLite for speed; this step proves the
      # schema also applies cleanly to the PostgreSQL the app actually ships on.
      - name: Verify migrations against PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: meva
          DB_USERNAME: meva
          DB_PASSWORD: secret
        run: php artisan migrate --force --seed

      - name: Run tests
        run: php artisan test
